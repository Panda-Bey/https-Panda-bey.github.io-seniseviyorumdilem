<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Veda</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
}

.container {
    max-width: 600px;
    opacity: 0;
    animation: fadeIn 2s forwards;
}

@keyframes fadeIn {
    to { opacity: 1; }
}

p {
    line-height: 1.6;
    font-size: 18px;
}
</style>

</head>
<body>

<div class="container">
    <p>
        Bu siteyi sana bir şeyleri güzel yaşatalım diye yapmıştım.<br><br>
        Ama bazı şeyler her zaman planladığımız gibi gitmiyor.<br><br>
        Yine de yaşadığımız her şey benim için gerçekti.<br><br>
        Kırgınlık yok, pişmanlık da yok.<br><br>
        Sadece yolumuz burada bitmiş gibi.<br><br>
        Kendine iyi bak…
    </p>

    <br><br>

    <h3>Bu site artık mevcut değil.</h3>
</div>

</body>
</html>
