<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seni Seviyorum ❤️</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:'Segoe UI',sans-serif;
 background: radial-gradient(circle at top,#ff7eb3,#ff4e8a,#c9184a);
 color:white;
 transition:1s;
}

/* INTRO */
#intro{
 position:fixed; inset:0;
 display:flex; align-items:center; justify-content:center;
 text-align:center; padding:30px;
 background:linear-gradient(135deg,#ff4e8a,#ff9ecb);
 z-index:9999;
}
.intro-box{
 background:rgba(255,255,255,.18);
 backdrop-filter:blur(12px);
 border-radius:22px;
 padding:34px;
 max-width:620px;
 box-shadow:0 15px 40px rgba(0,0,0,.3);
}

/* LAYOUT */
#app{display:none}
.layout{display:flex; min-height:100vh}

.sidebar{
 width:230px;
 background:rgba(0,0,0,.28);
 padding:18px 10px;
}
.menu-btn{width:100%; margin:7px 0}

.content{flex:1; padding:28px}

.card{
 background:rgba(255,255,255,.16);
 backdrop-filter:blur(12px);
 border-radius:22px;
 padding:26px;
 box-shadow:0 12px 34px rgba(0,0,0,.25);
 max-width:920px;
}

.section{display:none}
.section.active{display:block}

button{
 background:white;
 color:#ff4e8a;
 border:none;
 padding:12px 18px;
 border-radius:12px;
 cursor:pointer;
}

/* KAVANOZ */
.jar{font-size:90px; cursor:pointer}

/* OYUN */
#gameArea{
 position:relative;
 height:300px;
 background:rgba(255,255,255,.12);
 border-radius:20px;
 overflow:hidden;
}
.heart{
 position:absolute;
 font-size:26px;
 cursor:pointer;
 animation:fall linear forwards;
}
@keyframes fall{
 from{transform:translateY(-40px)}
 to{transform:translateY(340px)}
}

/* ASK MODU */
.love-mode{
 background: radial-gradient(circle at top,#ff99cc,#ff3366,#990033) !important;
}
.floating-heart{
 position:fixed;
 font-size:22px;
 pointer-events:none;
 animation:floatUp 4s linear forwards;
 z-index:9999;
}
@keyframes floatUp{
 from{transform:translateY(0); opacity:1}
 to{transform:translateY(-120vh); opacity:0}
}

</style>
</head>

<body>

<audio id="bgMusic" loop>
 <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- INTRO -->
<div id="intro">
 <div class="intro-box">
  <h1>Seni Seviyorum ❤️</h1>
  <p>Sevgililer günün kutlu olsun sevgilim. Bu site hep yanında olacak.</p>
  <h3>Beni seviyor musun?</h3>
  <button onclick="startApp()">Evet</button>
  <button onclick="startApp()">Evet 💖</button>
 </div>
</div>

<!-- APP -->
<div id="app" class="layout">

<div class="sidebar">
<button class="menu-btn" onclick="showSection('home')">Ana Sayfa</button>
<button class="menu-btn" onclick="showSection('jar')">Sevgi Kavanozu</button>
<button class="menu-btn" onclick="showSection('game')">Kalp Oyunu</button>
<button class="menu-btn" onclick="showSection('click')">Kalbi Yakala</button>
<button class="menu-btn" onclick="toggleLoveMode()">Aşk Modu 💞</button>
</div>

<div class="content">

<div id="home" class="section active">
<div class="card">
<h2>Hoş geldin sevgilim 💌</h2>
<button onclick="toggleMusic()">Müzik Aç/Kapat</button>
</div>
</div>

<div id="jar" class="section">
<div class="card">
<h2>Sevgi Kavanozu</h2>
<div class="jar" onclick="pullLove()">🏺</div>
<div id="jarText"></div>
</div>
</div>

<div id="game" class="section">
<div class="card">
<h2>Kalp Toplama Oyunu</h2>
<button onclick="startGame()">Başlat</button>
<div id="gameArea"></div>
<div id="score">Skor: 0</div>
</div>
</div>

<div id="click" class="section">
<div class="card">
<h2>Kalbi Yakala ⚡</h2>
<button onclick="startClickGame()">Başlat</button>
<div id="clickArea" style="height:260px;position:relative;background:rgba(255,255,255,.15);border-radius:20px"></div>
<div id="clickScore">Skor: 0</div>
</div>
</div>

</div>
</div>

<script>
function startApp(){
 intro.style.display="none";
 app.style.display="flex";
 bgMusic.volume=.6;
 bgMusic.play().catch(()=>{});
}

function toggleMusic(){
 bgMusic.paused ? bgMusic.play() : bgMusic.pause();
}

function showSection(id){
 document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
 document.getElementById(id).classList.add("active");
}

/* NOTLAR */
const loveNotes=["Seni seviyorum","İyi ki varsın","Kalbim senin","Gülüşün mucize"];
function pullLove(){
 jarText.innerText=loveNotes[Math.floor(Math.random()*loveNotes.length)];
}

/* OYUN 1 */
let gi,score=0;
function startGame(){
 score=0; scoreEl=score;
 score=0;
 scoreDiv.innerText="Skor: 0";
 gameArea.innerHTML="";
 clearInterval(gi);
 gi=setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerText="❤️";
  h.style.left=Math.random()*90+"%";
  h.style.animationDuration="3s";
  h.onclick=()=>{score++;scoreDiv.innerText="Skor: "+score;h.remove();}
  gameArea.appendChild(h);
  setTimeout(()=>h.remove(),3000);
 },600);
 setTimeout(()=>clearInterval(gi),15000);
}
const scoreDiv=document.getElementById("score");

/* OYUN 2 */
function startClickGame(){
 let s=0;
 clickScore.innerText="Skor: 0";
 const area=document.getElementById("clickArea");
 area.innerHTML="";
 const iv=setInterval(()=>{
  const h=document.createElement("div");
  h.innerText="💖";
  h.style.position="absolute";
  h.style.fontSize="30px";
  h.style.left=Math.random()*90+"%";
  h.style.top=Math.random()*80+"%";
  h.onclick=()=>{s++;clickScore.innerText="Skor: "+s;h.remove();}
  area.appendChild(h);
  setTimeout(()=>h.remove(),900);
 },700);
 setTimeout(()=>clearInterval(iv),15000);
}

/* ASK MODU */
let loveMode=false, rain;
function toggleLoveMode(){
 loveMode=!loveMode;
 document.body.classList.toggle("love-mode");
 if(loveMode){startRain(); bgMusic.volume=.9;}
 else{clearInterval(rain); bgMusic.volume=.6;}
}
function startRain(){
 rain=setInterval(()=>{
  const h=document.createElement("div");
  h.className="floating-heart";
  h.innerText="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.bottom="-20px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),4000);
 },200);
}
</script>

</body>
</html>
