<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senin İçin ❤️</title>

<link rel="manifest" href="manifest.json">

<style>
body{
 margin:0;
 font-family:Segoe UI,sans-serif;
 background:linear-gradient(135deg,#ff4e8a,#ff9ecb);
 color:white;
 overflow:hidden;
}

#intro{
 position:fixed;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 background:linear-gradient(135deg,#ff4e8a,#ff9ecb);
}

.box{
 background:rgba(255,255,255,.2);
 padding:30px;
 border-radius:20px;
 backdrop-filter:blur(10px);
}

button{
 padding:12px 20px;
 border:none;
 border-radius:12px;
 background:white;
 color:#ff4e8a;
 font-size:16px;
 cursor:pointer;
 margin:6px;
}

#app{display:none;height:100vh}

.sidebar{
 width:220px;
 background:rgba(0,0,0,.25);
 padding:10px;
 float:left;
 height:100%;
}

.content{
 margin-left:220px;
 padding:20px;
}

.card{
 background:rgba(255,255,255,.2);
 padding:20px;
 border-radius:18px;
}

.section{display:none}
.section.active{display:block}

.jar{font-size:80px;cursor:pointer}

#game{
 height:300px;
 position:relative;
 background:rgba(255,255,255,.2);
 border-radius:14px;
 overflow:hidden;
}

.heart{
 position:absolute;
 font-size:26px;
 cursor:pointer;
}
</style>
</head>

<body>

<div id="intro">
 <div class="box">
  <h1>Seni Seviyorum ❤️</h1>
  <p>Bu site hep yanında olacak</p>
  <button onclick="start()">Evet</button>
  <button onclick="start()">Evet 💖</button>
 </div>
</div>

<div id="app">
 <div class="sidebar">
  <button onclick="openSec('home')">Ana Sayfa</button>
  <button onclick="openSec('jar')">Kavanoz</button>
  <button onclick="openSec('gameSec')">Oyun</button>
  <button onclick="openSec('story')">Hikaye</button>
 </div>

 <div class="content">

  <div id="home" class="section active card">
   Hoş geldin sevgilim 💌
  </div>

  <div id="jar" class="section card">
   <div class="jar" onclick="note()">🏺</div>
   <p id="noteText"></p>
  </div>

  <div id="gameSec" class="section card">
   <button onclick="startGame()">Başlat</button>
   <div id="game"></div>
   <div id="score">0</div>
  </div>

  <div id="story" class="section card">
   <div id="storyText"></div>
   <button onclick="nextStory()">Devam</button>
  </div>

 </div>
</div>

<audio id="bgm" loop src="music.mp3"></audio>

<script src="app.js"></script>
</body>
</html>
